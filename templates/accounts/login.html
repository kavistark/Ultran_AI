{% extends 'base.html' %}
{% block title %}Sign In — AI ULTRAN{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        max-width: 440px;
        margin: 60px auto 70px;
    }
    .auth-card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 22px;
        padding: 34px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }
</style>
{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="auth-container fade-in">
        <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.4rem;">
                <i class="fas fa-brain"></i>
            </div>
            <h2 class="fw-bold mb-1">Welcome Back</h2>
            <p class="text-secondary" style="font-size: 0.95rem;">Sign in to access your ULTRAN AI Workspace</p>
        </div>

        <div class="auth-card">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="fas fa-arrow-right-to-bracket me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top" style="border-color: var(--border-color) !important;">
                <span class="text-secondary" style="font-size: 0.9rem;">Don't have an account yet?</span>
                <a href="{% url 'register' %}" class="fw-bold ms-1 text-primary text-decoration-none">Sign Up Free</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
