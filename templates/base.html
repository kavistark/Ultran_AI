<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>{% block title %}AI ULTRON // Kavi Stark{% endblock %}</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --bg-deep: #020617;
            --accent-red: #ef4444;
            --accent-crimson: #dc2626;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border-glow: rgba(239, 68, 68, 0.4);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: var(--bg-deep);
            color: var(--text-light);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .ultron-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .ultron-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Orbitron', 'Cinzel', sans-serif;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-decoration: none;
        }
        .ultron-brand .brand-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
        }
        .ultron-brand .brand-badge {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 6px;
        }
        .main-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 24px 20px;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="ultron-header">
        <a href="/" class="ultron-brand">
            <span class="brand-dot"></span>
            <span>AI ULTRON</span>
            <span class="brand-badge">KAVI STARK</span>
        </a>
        <div style="font-family:'JetBrains Mono',monospace; font-size:0.8rem; color:#64748b;">
            STATUS: ACTIVE
        </div>
    </header>

    <main class="main-container">
        {% block content %}{% endblock %}
    </main>

    {% block extra_js %}{% endblock %}
</body>
</html>
