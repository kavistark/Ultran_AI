<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ULTRAN — Voice Interface</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #030611;
            --accent-cyan: #06b6d4;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            color: #fff;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            cursor: pointer;
        }

        /* Ambient Cosmic Background Lighting */
        .ambient-glow {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.18) 0%, transparent 60%),
                radial-gradient(circle at 20% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
            pointer-events: none;
            z-index: 1;
            transition: all 0.8s ease;
        }

        /* Minimalist Top Identity Bar */
        .top-voice-bar {
            position: absolute;
            top: 28px;
            left: 0;
            right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            z-index: 30;
            pointer-events: none;
        }

        .assistant-tag {
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.9);
        }

        .assistant-tag .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: pulseDot 2s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .status-pill {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            transition: all 0.3s ease;
            backdrop-filter: blur(12px);
        }

        .status-pill.listening {
            border-color: rgba(244, 63, 94, 0.6);
            color: #fb7185;
            background: rgba(244, 63, 94, 0.14);
            box-shadow: 0 0 25px rgba(244, 63, 94, 0.3);
        }

        .status-pill.thinking {
            border-color: rgba(245, 158, 11, 0.6);
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.14);
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.3);
        }

        .status-pill.speaking {
            border-color: rgba(16, 185, 129, 0.6);
            color: #34d399;
            background: rgba(16, 185, 129, 0.14);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.3);
        }

        /* Central Voice Entity Stage */
        .voice-entity-stage {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        /* Concentric Holographic Rings */
        .ring-aura {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(59, 130, 246, 0.3);
            pointer-events: none;
            transition: transform 0.08s ease-out, border-color 0.4s ease, opacity 0.4s ease;
        }

        .ring-1 { width: 220px; height: 220px; }
        .ring-2 { width: 300px; height: 300px; }
        .ring-3 { width: 380px; height: 380px; }
        .ring-4 { width: 460px; height: 460px; }

        /* The Reactive AI Voice Orb */
        .voice-core-orb {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1d4ed8 0%, #7c3aed 50%, #06b6d4 100%);
            box-shadow: 0 0 70px rgba(59, 130, 246, 0.8), inset 0 0 35px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.2rem;
            color: #fff;
            position: relative;
            z-index: 20;
            transition: transform 0.06s ease-out, box-shadow 0.25s ease, background 0.5s ease;
        }

        /* State Color Morphing */
        body.state-idle .voice-core-orb {
            background: linear-gradient(135deg, #1e3a8a 0%, #4338ca 50%, #0284c7 100%);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.5);
        }

        body.state-listening .voice-core-orb {
            background: linear-gradient(135deg, #e11d48 0%, #db2777 50%, #f59e0b 100%);
            box-shadow: 0 0 95px rgba(225, 29, 72, 0.9), inset 0 0 40px rgba(255, 255, 255, 0.6);
        }

        body.state-thinking .voice-core-orb {
            background: linear-gradient(135deg, #f59e0b 0%, #8b5cf6 50%, #06b6d4 100%);
            box-shadow: 0 0 95px rgba(245, 158, 11, 0.9);
            animation: orbitalRotation 2s linear infinite;
        }

        body.state-speaking .voice-core-orb {
            background: linear-gradient(135deg, #059669 0%, #06b6d4 50%, #3b82f6 100%);
            box-shadow: 0 0 95px rgba(5, 150, 105, 0.9), inset 0 0 40px rgba(255, 255, 255, 0.6);
        }

        @keyframes orbitalRotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Soundwave Canvas across bottom screen */
        #soundwaveCanvas {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            pointer-events: none;
            z-index: 15;
            filter: drop-shadow(0 -10px 20px rgba(59, 130, 246, 0.35));
        }
    </style>
</head>
<body class="state-idle" id="stageBody" onclick="handleStageTap()">

    <!-- Ambient Cosmic Aurora -->
    <div class="ambient-glow" id="ambientGlow"></div>

    <!-- Minimal Identity Header -->
    <div class="top-voice-bar">
        <div class="assistant-tag">
            <span class="dot"></span>
            <span>AI ULTRAN</span>
        </div>
        <div class="status-pill" id="statusPill">
            TAP TO TALK
        </div>
    </div>

    <!-- Central Reactive Voice Entity -->
    <div class="voice-entity-stage">
        <div class="ring-aura ring-1" id="ring1"></div>
        <div class="ring-aura ring-2" id="ring2"></div>
        <div class="ring-aura ring-3" id="ring3"></div>
        <div class="ring-aura ring-4" id="ring4"></div>

        <div class="voice-core-orb" id="voiceOrb">
            <i class="fas fa-microphone" id="orbIcon"></i>
        </div>
    </div>

    <!-- Real-Time Microphone Reactive Soundwave -->
    <canvas id="soundwaveCanvas"></canvas>
    <!-- {{ user.first_name }} -->

    <script>
        const CSRF_TOKEN = '{{ csrf_token }}';

        let isListening = false;
        let isSpeaking = false;
        let isThinking = false;
        let speechRecognizer = null;
        let currentConversationId = null;
        let capturedVoiceTranscript = '';
        let hasWelcomed = false;

        function playWelcomeGreeting() {
            if (hasWelcomed) return;
            hasWelcomed = true;
            statusPill.textContent = 'SPEAKING';
            speakVoiceResponse("I am ULTRAN, a personal voice assistant for Kavi Stark. How can I assist you today?");
        }

        // Web Audio API context & nodes
        let audioCtx = null;
        let audioAnalyser = null;
        let micStream = null;
        let freqArray = null;

        const bodyEl = document.getElementById('stageBody');
        const statusPill = document.getElementById('statusPill');
        const voiceOrb = document.getElementById('voiceOrb');
        const orbIcon = document.getElementById('orbIcon');
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');
        const ring3 = document.getElementById('ring3');
        const ring4 = document.getElementById('ring4');

        // ==========================================
        // 1. REAL-TIME REACTIVE SOUNDWAVE CANVAS
        // ==========================================
        const canvas = document.getElementById('soundwaveCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.40;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let wavePhase = 0;

        function animateSoundwave() {
            requestAnimationFrame(animateSoundwave);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let audioAmplitude = 0;

            // Read live frequency data from microphone if active
            if (isListening && audioAnalyser && freqArray) {
                audioAnalyser.getByteFrequencyData(freqArray);
                let sum = 0;
                for (let i = 0; i < freqArray.length; i++) {
                    sum += freqArray[i];
                }
                audioAmplitude = (sum / freqArray.length) / 255;
            } else if (isSpeaking) {
                // Energetic pulsating speech wave
                audioAmplitude = 0.45 + Math.sin(Date.now() / 110) * 0.35 + Math.random() * 0.15;
            } else if (isThinking) {
                audioAmplitude = 0.22 + Math.sin(Date.now() / 180) * 0.16;
            } else {
                // Soft breathing idle wave
                audioAmplitude = 0.05 + Math.sin(Date.now() / 600) * 0.02;
            }

            // Real-time expansion of the central AI Orb & Rings tied directly to voice volume
            const orbScale = 1 + audioAmplitude * 0.55;
            voiceOrb.style.transform = `scale(${orbScale})`;
            ring1.style.transform = `scale(${1 + audioAmplitude * 0.7})`;
            ring2.style.transform = `scale(${1 + audioAmplitude * 1.1})`;
            ring3.style.transform = `scale(${1 + audioAmplitude * 1.5})`;
            ring4.style.transform = `scale(${1 + audioAmplitude * 1.9})`;

            // Draw fluid reactive soundwaves
            wavePhase += (isListening || isSpeaking) ? 0.09 : 0.025;
            const centerY = canvas.height * 0.55;

            drawFluidSineWave(centerY, audioAmplitude * 90, wavePhase, 'rgba(6, 182, 212, 0.85)', 3.5);
            drawFluidSineWave(centerY, audioAmplitude * 110, wavePhase + 1.4, 'rgba(59, 130, 246, 0.95)', 4.0);
            drawFluidSineWave(centerY, audioAmplitude * 80, wavePhase + 2.8, 'rgba(139, 92, 246, 0.85)', 3.0);
        }

        function drawFluidSineWave(centerY, amplitude, phase, strokeColor, lineWidth) {
            ctx.beginPath();
            ctx.lineWidth = lineWidth;
            ctx.strokeStyle = strokeColor;

            const totalPoints = 140;
            const sliceWidth = canvas.width / totalPoints;
            let x = 0;

            for (let i = 0; i <= totalPoints; i++) {
                const envelope = Math.sin((i / totalPoints) * Math.PI); // Smooth zero at edges
                const y = centerY + Math.sin(phase + i * 0.15) * amplitude * envelope;

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
                x += sliceWidth;
            }
            ctx.stroke();
        }

        animateSoundwave();

        // ==========================================
        // 2. STATE MANAGER
        // ==========================================
        function setVoiceState(state) {
            bodyEl.className = `state-${state}`;
            statusPill.className = `status-pill ${state}`;

            if (state === 'listening') {
                statusPill.textContent = 'LISTENING';
                orbIcon.className = 'fas fa-microphone text-white';
            } else if (state === 'thinking') {
                statusPill.textContent = 'THINKING';
                orbIcon.className = 'fas fa-brain text-white';
            } else if (state === 'speaking') {
                statusPill.textContent = 'SPEAKING';
                orbIcon.className = 'fas fa-volume-high text-white';
            } else {
                statusPill.textContent = 'READY';
                orbIcon.className = 'fas fa-microphone text-white';
            }
        }

        // ==========================================
        // 3. MICROPHONE & AUDIO CONTEXT
        // ==========================================
        async function setupMicrophoneStream() {
            if (audioCtx) return;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const source = audioCtx.createMediaStreamSource(micStream);
                audioAnalyser = audioCtx.createAnalyser();
                audioAnalyser.fftSize = 128;
                source.connect(audioAnalyser);
                freqArray = new Uint8Array(audioAnalyser.frequencyBinCount);
            } catch (err) {
                console.warn('Microphone stream notice:', err);
            }
        }

        // ==========================================
        // 4. VOICE SPEECH RECOGNITION (VOICE ONLY)
        // ==========================================
        function handleStageTap() {
            if (!hasWelcomed) {
                playWelcomeGreeting();
                return;
            }
            if (isListening) {
                stopSpeechCapture();
            } else {
                startSpeechCapture();
            }
        }

        // Spacebar shortcut to activate/deactivate
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                handleStageTap();
            }
        });

        async function startSpeechCapture() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            await setupMicrophoneStream();
            if (audioCtx && audioCtx.state === 'suspended') {
                await audioCtx.resume();
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                console.warn('SpeechRecognition API not supported in this browser.');
                return;
            }

            try {
                capturedVoiceTranscript = '';
                speechRecognizer = new SpeechRecognition();
                speechRecognizer.continuous = false;
                speechRecognizer.interimResults = true;
                speechRecognizer.lang = 'en-US';

                speechRecognizer.onstart = () => {
                    isListening = true;
                    setVoiceState('listening');
                };

                speechRecognizer.onresult = (event) => {
                    let text = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        text += event.results[i][0].transcript;
                    }
                    capturedVoiceTranscript = text.trim();
                };

                speechRecognizer.onerror = (event) => {
                    console.warn('Recognition event notice:', event.error);
                    stopSpeechCapture();
                };

                speechRecognizer.onend = () => {
                    stopSpeechCapture();
                    const spokenQuery = capturedVoiceTranscript.trim();
                    if (spokenQuery) {
                        executeVoiceQuery(spokenQuery);
                    } else if (!isSpeaking && !isThinking) {
                        setTimeout(startSpeechCapture, 600); // Continuous hands-free auto listen
                    }
                };

                speechRecognizer.start();
            } catch (err) {
                console.error(err);
                stopSpeechCapture();
            }
        }

        function stopSpeechCapture() {
            isListening = false;
            if (!isSpeaking && !isThinking) {
                setVoiceState('idle');
            }
            if (speechRecognizer) {
                try { speechRecognizer.stop(); } catch(e) {}
            }
        }

        // ==========================================
        // 5. QUERY DISPATCH & MALE VOICE SYNTHESIS
        // ==========================================
        async function executeVoiceQuery(queryText) {
            isThinking = true;
            setVoiceState('thinking');

            // Quick Voice Commands Check
            const lower = queryText.toLowerCase().trim();
            if (lower === 'stop' || lower === 'quiet' || lower === 'pause' || lower === 'mute') {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                setVoiceState('idle');
                return;
            }

            try {
                const response = await fetch('/api/chat/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': CSRF_TOKEN,
                    },
                    body: JSON.stringify({
                        message: queryText,
                        conversation_id: currentConversationId,
                        is_voice: true,
                    }),
                });

                const data = await response.json();
                isThinking = false;

                if (data.error) {
                    speakVoiceResponse(data.error);
                } else {
                    if (data.conversation_id) currentConversationId = data.conversation_id;
                    const replyText = data.response || '';
                    speakVoiceResponse(replyText);
                }
            } catch (err) {
                isThinking = false;
                setVoiceState('idle');
                speakVoiceResponse("Service temporarily busy. Please ask again.");
            }
        }

        // Deep Natural Male Voice Output
        function speakVoiceResponse(rawText) {
            if (!('speechSynthesis' in window)) {
                setVoiceState('idle');
                setTimeout(startSpeechCapture, 800);
                return;
            }

            window.speechSynthesis.cancel();

            const cleanText = rawText
                .replace(/```[\s\S]*?```/g, '')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/\*\*([^*]+)\*\*/g, '$1')
                .replace(/\*([^*]+)\*/g, '$1')
                .replace(/#/g, '')
                .trim();

            if (!cleanText) {
                setVoiceState('idle');
                setTimeout(startSpeechCapture, 600);
                return;
            }

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.rate = 1.02;  // Confident conversational cadence
            utterance.pitch = 0.92; // Deep resonant male pitch

            // Select natural male voice
            const voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) {
                const maleVoice = voices.find(v => {
                    const n = v.name.toLowerCase();
                    const lang = v.lang.toLowerCase();
                    if (!lang.startsWith('en')) return false;
                    return (
                        n.includes('david') ||        // Windows Microsoft David (Male)
                        n.includes('mark') ||         // Windows Microsoft Mark (Male)
                        n.includes('george') ||       // Microsoft George (Male)
                        n.includes('guy') ||          // Microsoft Guy (Male)
                        n.includes('ryan') ||         // Microsoft Ryan (Male)
                        n.includes('alex') ||         // Apple Alex (Male)
                        n.includes('daniel') ||       // Apple Daniel (Male)
                        n.includes('male') ||         // Google UK / US English Male
                        n.includes('oliver')
                    );
                }) || voices.find(v => {
                    const n = v.name.toLowerCase();
                    return n.includes('david') || n.includes('male') || n.includes('alex');
                }) || voices.find(v => v.lang.startsWith('en'));

                if (maleVoice) {
                    utterance.voice = maleVoice;
                }
            }

            utterance.onstart = () => {
                isSpeaking = true;
                setVoiceState('speaking');
            };

            utterance.onend = () => {
                isSpeaking = false;
                setVoiceState('idle');
                // Continuous voice loop: re-arms listening automatically
                setTimeout(startSpeechCapture, 700);
            };

            utterance.onerror = () => {
                isSpeaking = false;
                setVoiceState('idle');
                setTimeout(startSpeechCapture, 700);
            };

            window.speechSynthesis.speak(utterance);
        }

        // Warm up voices on page load and attempt initial auto-welcome
        window.addEventListener('load', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.onvoiceschanged = () => {
                    window.speechSynthesis.getVoices();
                    setTimeout(() => {
                        if (!hasWelcomed) playWelcomeGreeting();
                    }, 400);
                };
                window.speechSynthesis.getVoices();
                setTimeout(() => {
                    if (!hasWelcomed) playWelcomeGreeting();
                }, 700);
            }
        });
    </script>
</body>
</html>
